<!DOCTYPE html>
<html lang="eng" >
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FeastRush | Login</title>
        <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

        <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing: border-box;
            }

            body{
                font-family: 'DM Sans', sans-serif;
                background: #0d0d0d;
                color: #f5f5f5;
                min-height: 100vh;
                display: flex;
            }

            /*left panel*/
            .left-panel{
                flex:1;
                background: linear-gradient(135deg, #FF4D00, #FF8C00, #FFB800);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 60px;

            }
            .brand {
                font-family: 'Syne', sans-serif;
                font-size: 3rem;
                font-weight: 800;
                color: white;
            }

            .brand span{
                color: #0d0d0d;
                
            }
            .tagline{
                color: rgba(255,255,255,0.85);
                margin-top: 15px;
                text-align: center;
            }

            .food-emojis{
                display: flex;
                gap: 20px;
                margin-top: 50px;
                font-size: 3rem;
            }

            .stats{
                display: flex;
                gap: 40px;
                margin-top: 60px;
            }

            .stat{
                text-align: center;
                color: white;
            }

            .stat-num{
                font-family: 'Syne', sans-serif;
                font-size: 2rem;
                font-weight: 800;
            }

            .stat-label{
                font-size: 0.8rem;
                opacity:0.8;
            }

            /*Right Panel*/
            .right-panel{
                width: 480px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 60px 50px;
                background: #0d0d0d;
            }

            .form-title{
                font-family: 'Syne', sans-serif;
                font-size: 2rem;
                font-weight: 700;
                margin-bottom: 8px;
            }

            .form-subtitle{
                color:#888;
                margin-bottom: 35px;
                font-size: 0.95rem;
            }

            /* Input Styles */

            .input-group{
                text-align: left;
                margin: bottom 18px;
                position: relative;
            }

            .input-group label {
                display: block;
                font-size: 0.85rem;
                color: #888;
                margin-bottom: 7;
            }

            .input-group i{
                position: absolute;
                left: 14px;
                top: 42px;
                color: #888;
                font-size: 0.9rem;
            }

            .input-group input{
                width: 100%;
                padding: 13px 14px 13px 40px;
                background: #1a1a1a;
                border: 1px solid #2a2a2a;
                border-radius:10px;
            }

            .input-group input:focus{
                border-color: #FF4D00
            }

            /* Button */

            .btn{
                width: 100%;
                padding: 14px;
                background: linear-gradient(135deg, #FF4D00, #FF8C00);
                border: none;
                border-radius: 10px;
                color: white;
                font-family: 'Syne', sans-serif;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                margin-top: 5px;
            }

            .btn:hover{
                box-shadow: 0 10px 30px rgba(255, 77, 0, 0.4);
                transform: translateY(-2px);
            }
        </style>
    </head>
    <body>
         
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="brand">Feast<span>Rush</span></div>
            <p class="tagline">Delicious food delivered to your door 🚀</p>
            <div class="food-emojis">
                <span>🍕</span>
                <span>🍔</span>
                <span>🌮</span>
                <span>🍜</span>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-num">500+</div>
                    <div class="stat-label">Restaurants</div>
                </div>
                <div class="stat">
                    <div class="stat-num">30min</div>
                    <div class="stat-label">Avg Delivery</div>
                </div>
                <div class="stat">
                    <div class="stat-num">50K+</div>
                    <div class="stat-label">Happy Users</div>
                </div>
            </div>
        </div>

        <!-- Right Panel -->

        <div class="right-panel">
            <div class="form-title">Welcome Back! 👋</div>
            <div class="form-subtitle">Sign in to order your favourite food</div>

            <!-- Login Form -->
            <div class="input-group">
                <label>Email Address</label>
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="you@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter password">
            </div>
            <button class="btn" onclick="window.location.href='index.html'">
                Login & Order Now
            </button>

        </div>

    </body>
    

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeastRush | Order Confirmed</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4D00; --secondary: #FFB800; --accent: #00C896;
            --dark: #0D0D0D; --card: #1A1A1A; --text: #F5F5F5;
            --muted: #888; --border: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 60px; background: rgba(13,13,13,0.95);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
        }
        .brand { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .brand span { color: var(--text); }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: var(--muted); text-decoration: none; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        .container { max-width: 700px; margin: 0 auto; padding: 60px 30px; }

        /* Success Banner */
        .success-banner {
            text-align: center;
            background: linear-gradient(135deg, rgba(0,200,150,0.1), rgba(0,200,150,0.05));
            border: 1px solid rgba(0,200,150,0.3);
            border-radius: 20px;
            padding: 50px 30px;
            margin-bottom: 35px;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: spin 0.6s ease;
        }

        @keyframes spin {
            0% { transform: rotate(-180deg) scale(0); }
            100% { transform: rotate(0) scale(1); }
        }

        .success-banner h2 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .success-banner p { color: var(--muted); font-size: 1rem; }

        .order-id {
            display: inline-block;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            margin-top: 15px;
            color: var(--secondary);
        }

        /* Tracker */
        .tracker-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .tracker-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .tracker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .tracker::before {
            content: '';
            position: absolute;
            top: 20px; left: 40px; right: 40px;
            height: 3px;
            background: var(--border);
            z-index: 0;
        }

        .tracker-progress {
            position: absolute;
            top: 20px; left: 40px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
            z-index: 1;
            transition: width 1s ease;
            width: 0%;
        }

        .step { text-align: center; z-index: 2; }

        .step-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 1rem;
            transition: all 0.5s;
        }

        .step.done .step-icon {
            background: var(--accent);
            box-shadow: 0 0 15px rgba(0,200,150,0.4);
        }

        .step.active .step-icon {
            background: var(--secondary);
            box-shadow: 0 0 15px rgba(255,184,0,0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .step-label { font-size: 0.75rem; color: var(--muted); }
        .step.done .step-label, .step.active .step-label { color: var(--text); font-weight: 600; }

        .eta {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .eta span { color: var(--secondary); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; }

        /* Order Items */
        .items-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .items-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }

        .order-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .order-item:last-child { border-bottom: none; }
        .order-item .emoji { font-size: 1.8rem; }
        .order-item .name { flex: 1; font-weight: 500; }
        .order-item .qty { color: var(--muted); font-size: 0.9rem; }
        .order-item .price { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--primary); }

        .total-row {
            display: flex; justify-content: space-between;
            padding: 15px 0 0;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            border-top: 1px solid var(--border);
            margin-top: 5px;
        }

        .home-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, var(--primary), #FF8C00);
            border: none; border-radius: 10px; color: white;
            font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }

        .home-btn:hover { box-shadow: 0 10px 30px rgba(255,77,0,0.4); transform: translateY(-2px); }

        @media (max-width: 768px) {
            nav { padding: 18px 20px; }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">Feast<span>Rush</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="order.html" class="active">Orders</a>
        </div>
    </nav>

    <div class="container">
        <!-- Success Banner -->
        <div class="success-banner">
            <div class="success-icon">🎉</div>
            <h2>Order Confirmed!</h2>
            <p>Your food is being prepared with love 🍕</p>
            <div class="order-id" id="order-id">#FR00000</div>
        </div>

        <!-- Tracker -->
        <div class="tracker-card">
            <div class="tracker-title">📍 Live Order Tracking</div>
            <div class="tracker">
                <div class="tracker-progress" id="progress-bar"></div>
                <div class="step done" id="step1">
                    <div class="step-icon">✅</div>
                    <div class="step-label">Confirmed</div>
                </div>
                <div class="step active" id="step2">
                    <div class="step-icon">👨‍🍳</div>
                    <div class="step-label">Preparing</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-icon">🛵</div>
                    <div class="step-label">On the way</div>
                </div>
                <div class="step" id="step4">
                    <div class="step-icon">🏠</div>
                    <div class="step-label">Delivered</div>
                </div>
            </div>
            <div class="eta">Estimated delivery: <span id="eta-time">30 mins</span></div>
        </div>

        <!-- Order Items -->
        <div class="items-card">
            <div class="items-title">🧾 Order Summary</div>
            <div id="order-items"></div>
            <div class="total-row">
                <span>Total Paid</span>
                <span id="order-total" style="color:var(--accent)">₹0</span>
            </div>
        </div>

        <button class="home-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i> Back to Home
        </button>
    </div>

    <script>
        const order = JSON.parse(localStorage.getItem('lastOrder')) || [];

        // Generate order ID
        document.getElementById('order-id').innerText = '#FR' + Math.floor(10000 + Math.random() * 90000);

        // ETA countdown
        let eta = 30;
        const etaEl = document.getElementById('eta-time');
        const countdown = setInterval(() => {
            if (eta > 0) { eta--; etaEl.innerText = eta + ' mins'; }
            else { etaEl.innerText = 'Arriving now!'; clearInterval(countdown); }
        }, 60000);

        // Animate tracker
        setTimeout(() => {
            document.getElementById('progress-bar').style.width = '33%';
        }, 500);

        setTimeout(() => {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step2').classList.add('done');
            document.getElementById('step3').classList.add('active');
            document.getElementById('progress-bar').style.width = '66%';
        }, 8000);

        setTimeout(() => {
            document.getElementById('step3').classList.remove('active');
            document.getElementById('step3').classList.add('done');
            document.getElementById('step4').classList.add('active');
            document.getElementById('progress-bar').style.width = '100%';
        }, 16000);

        setTimeout(() => {
            document.getElementById('step4').classList.remove('active');
            document.getElementById('step4').classList.add('done');
            etaEl.innerText = 'Delivered! 🎉';
        }, 24000);

        // Render order items
        const container = document.getElementById('order-items');
        let total = 0;

        if (order.length === 0) {
            container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">No order found</p>';
        } else {
            container.innerHTML = order.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="order-item">
                        <span class="emoji">${item.emoji}</span>
                        <span class="name">${item.name}</span>
                        <span class="qty">x${item.qty}</span>
                        <span class="price">₹${item.price * item.qty}</span>
                    </div>`;
            }).join('');
        }

        const tax = Math.round(total * 0.05);
        document.getElementById('order-total').innerText = '₹' + (total + tax);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeastRush | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4D00;
            --secondary: #FFB800;
            --accent: #00C896;
            --dark: #0D0D0D;
            --card: #1A1A1A;
            --text: #F5F5F5;
            --muted: #888;
            --border: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 60px; background: rgba(13,13,13,0.95);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
        }
        .brand { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .brand span { color: var(--text); }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: var(--muted); text-decoration: none; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        .container { max-width: 1100px; margin: 0 auto; padding: 50px 30px; display: grid; grid-template-columns: 1fr 360px; gap: 30px; }

        .section-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 25px; }
        .section-title span { color: var(--primary); }

        /* Cart Items */
        .cart-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 14px;
            transition: all 0.3s;
        }
        .cart-item:hover { border-color: var(--primary); }
        .item-emoji { font-size: 2.5rem; width: 60px; text-align: center; }
        .item-info { flex: 1; }
        .item-name { font-family: 'Syne', sans-serif; font-weight: 700; margin-bottom: 4px; }
        .item-price { color: var(--primary); font-weight: 600; }
        .qty-control { display: flex; align-items: center; gap: 12px; }
        .qty-btn {
            width: 30px; height: 30px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--dark);
            color: var(--text); cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .qty-btn:hover { background: var(--primary); border-color: var(--primary); }
        .qty { font-family: 'Syne', sans-serif; font-weight: 700; min-width: 20px; text-align: center; }
        .remove-btn { background: none; border: none; color: #ff4444; cursor: pointer; font-size: 1rem; padding: 5px; transition: transform 0.3s; }
        .remove-btn:hover { transform: scale(1.2); }

        /* Empty Cart */
        .empty-cart { text-align: center; padding: 80px 20px; }
        .empty-cart .emoji { font-size: 5rem; margin-bottom: 20px; }
        .empty-cart h3 { font-family: 'Syne', sans-serif; font-size: 1.5rem; margin-bottom: 10px; }
        .empty-cart p { color: var(--muted); margin-bottom: 25px; }

        /* Summary Card */
        .summary-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .summary-title { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
        .summary-row.total { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 5px; }
        .summary-row .label { color: var(--muted); }
        .summary-row.total .label, .summary-row.total .value { color: var(--text); }
        .value { font-weight: 600; }
        .free { color: var(--accent); }

        .checkout-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, var(--primary), #FF8C00);
            border: none; border-radius: 10px; color: white;
            font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s; margin-top: 15px;
        }
        .checkout-btn:hover { box-shadow: 0 10px 30px rgba(255,77,0,0.4); transform: translateY(-2px); }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--muted); text-decoration: none; margin-bottom: 20px;
            transition: color 0.3s; font-size: 0.9rem;
        }
        .back-btn:hover { color: var(--text); }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; padding: 25px 20px; }
            nav { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">Feast<span>Rush</span></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="cart.html" class="active">Cart</a>
            <a href="order.html">Orders</a>
        </div>
    </nav>

    <div class="container">
        <div>
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
            <div class="section-title">Your <span>Cart</span></div>
            <div id="cart-container"></div>
        </div>

        <div class="summary-card">
            <div class="summary-title">Order Summary</div>
            <div class="summary-row"><span class="label">Subtotal</span><span class="value" id="subtotal">₹0</span></div>
            <div class="summary-row"><span class="label">Delivery Fee</span><span class="value free" id="delivery">FREE</span></div>
            <div class="summary-row"><span class="label">Taxes (5%)</span><span class="value" id="tax">₹0</span></div>
            <div class="summary-row total"><span class="label">Total</span><span class="value" id="total">₹0</span></div>
            <button class="checkout-btn" onclick="placeOrder()"><i class="fas fa-bolt"></i> Place Order</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderCart() {
            const container = document.getElementById('cart-container');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="emoji">🛒</div>
                        <h3>Your cart is empty!</h3>
                        <p>Add some delicious items from our menu</p>
                        <button class="checkout-btn" style="width:auto;padding:12px 30px" onclick="window.location.href='index.html'">Browse Menu</button>
                    </div>`;
                updateSummary();
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="item-emoji">${item.emoji}</div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">₹${item.price} each</div>
                    </div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span class="qty">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                    <div style="font-family:'Syne',sans-serif;font-weight:700;min-width:60px;text-align:right">₹${item.price * item.qty}</div>
                    <button class="remove-btn" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            updateSummary();
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
            }
            saveAndRender();
        }

        function removeItem(id) {
            cart = cart.filter(c => c.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const tax = Math.round(subtotal * 0.05);
            const total = subtotal + tax;
            document.getElementById('subtotal').innerText = '₹' + subtotal;
            document.getElementById('tax').innerText = '₹' + tax;
            document.getElementById('total').innerText = '₹' + total;
        }

        function placeOrder() {
            if (cart.length === 0) { alert('Add items to cart first!'); return; }
            localStorage.setItem('lastOrder', JSON.stringify(cart));
            localStorage.removeItem('cart');
            window.location.href = 'order.html';
        }

        renderCart();
    </script>
</body>
</html>

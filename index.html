<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeastRush | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #0D0D0D;
            color: #F5F5F5;
        }

        /* Navbar */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 60px;
            background: rgba(13,13,13,0.95);
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #FF4D00;
        }

        .brand span { 
            color: #F5F5F5; 
        }

        .nav-links { 
            display: flex; 
            gap: 30px; 
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active { 
            color: #F5F5F5; 
        }

        .cart-btn {
            background: #FF4D00;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn:hover { 
            background: #e04400; 
        }

        .cart-count {
            background: #FFB800;
            color: #0D0D0D;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hero */
        .hero {
            padding: 70px 60px;
            background: linear-gradient(135deg, #0D0D0D, #1a0a00);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hero-text h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .hero-text h1 span { 
            color: #FF4D00; 
        }

        .hero-text p {
            color: #888;
            margin-top: 15px;
            font-size: 1.05rem;
            max-width: 450px;
        }

        .hero-emoji {
            font-size: 8rem;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Search */
        .search-section {
            padding: 0 60px;
            margin-top: -25px;
            position: relative;
            z-index: 10;
        }

        .search-bar {
            background: #1A1A1A;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .search-bar i { 
            color: #FF4D00; 
            font-size: 1.1rem; 
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #F5F5F5;
            font-size: 1rem;
            outline: none;
        }

        .search-bar input::placeholder { 
            color: #888; 
        }

        /* Menu Section */
        .section { padding: 50px 60px; }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .section-title span { color: #FF4D00; }

        /* Category Buttons */
        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .category-btn {
            padding: 10px 22px;
            border-radius: 25px;
            border: 1px solid #2a2a2a;
            background: #1A1A1A;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .category-btn:hover, .category-btn.active {
            background: #FF4D00;
            color: white;
            border-color: #FF4D00;
        }

        /* Food Cards */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .food-card {
            background: #1A1A1A;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            transition: all 0.3s;
        }

        .food-card:hover {
            transform: translateY(-5px);
            border-color: #FF4D00;
        }

        .food-img {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
            font-size: 5rem;
        }

        .food-info { padding: 16px; }

        .food-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .food-desc { color: #888; font-size: 0.82rem; margin-bottom: 12px; }

        .food-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .food-price {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #FF4D00;
        }

        .food-rating { color: #FFB800; font-size: 0.85rem; }

        .add-btn {
            background: #FF4D00;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .add-btn:hover { transform: scale(1.1); }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00C896;
            color: #0D0D0D;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 999;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="brand">Feast<span>Rush</span></div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="cart.html">Cart</a>
            <a href="order.html">Orders</a>
        </div>
        <button class="cart-btn" onclick="window.location.href='cart.html'">
            <i class="fas fa-shopping-bag"></i> Cart
            <div class="cart-count" id="nav-cart-count">0</div>
        </button>
    </nav>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-text">
            <h1>Hungry? <br>We've Got <span>You Covered!</span></h1>
            <p>Order from 500+ restaurants. Hot, fresh food delivered in 30 minutes or less.</p>
        </div>
        <div class="hero-emoji">🍕</div>
    </div>
    <!-- Search -->
    <div class="search-section">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" 
            placeholder="Search for pizza, burgers, biryani..." 
            oninput="filterFood()">
        </div>
    </div>
    <!-- Menu Section -->
    <div class="section">
        <div class="section-title">Our <span>Menu</span></div>

        <!-- Categories -->
        <div class="categories">
            <button class="category-btn active" onclick="filterCategory('all', this)">🍽️ All</button>
            <button class="category-btn" onclick="filterCategory('pizza', this)">🍕 Pizza</button>
            <button class="category-btn" onclick="filterCategory('burger', this)">🍔 Burger</button>
            <button class="category-btn" onclick="filterCategory('biryani', this)">🍛 Biryani</button>
            <button class="category-btn" onclick="filterCategory('pasta', this)">🍝 Pasta</button>
            <button class="category-btn" onclick="filterCategory('dessert', this)">🍰 Dessert</button>
            <button class="category-btn" onclick="filterCategory('drinks', this)">🥤 Drinks</button>
        </div>

        <!-- Food Grid -->
        <div class="food-grid" id="food-grid"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Added to cart!</div>
    <script>
        const foods = [
            { id: 1, name: "Margherita Pizza", desc: "Classic tomato, mozzarella, fresh basil", price: 299, rating: 4.8, emoji: "🍕", category: "pizza" },
            { id: 2, name: "BBQ Chicken Pizza", desc: "Smoky BBQ sauce, grilled chicken, onions", price: 399, rating: 4.6, emoji: "🍕", category: "pizza" },
            { id: 3, name: "Smash Burger", desc: "Double patty, cheddar, lettuce, special sauce", price: 249, rating: 4.7, emoji: "🍔", category: "burger" },
            { id: 4, name: "Veggie Burger", desc: "Crispy veggie patty, tomato, pickles", price: 189, rating: 4.3, emoji: "🍔", category: "burger" },
            { id: 5, name: "Chicken Biryani", desc: "Fragrant basmati, tender chicken, saffron", price: 349, rating: 4.9, emoji: "🍛", category: "biryani" },
            { id: 6, name: "Veg Biryani", desc: "Mixed vegetables, aromatic spices, raita", price: 249, rating: 4.5, emoji: "🍛", category: "biryani" },
            { id: 7, name: "Pasta Arrabbiata", desc: "Spicy tomato sauce, garlic, penne pasta", price: 219, rating: 4.4, emoji: "🍝", category: "pasta" },
            { id: 8, name: "Creamy Alfredo", desc: "Rich cream sauce, parmesan, fettuccine", price: 259, rating: 4.6, emoji: "🍝", category: "pasta" },
            { id: 9, name: "Chocolate Lava Cake", desc: "Warm chocolate cake, vanilla ice cream", price: 149, rating: 4.9, emoji: "🍰", category: "dessert" },
            { id: 10, name: "Mango Cheesecake", desc: "Creamy cheesecake, fresh mango topping", price: 169, rating: 4.7, emoji: "🍰", category: "dessert" },
            { id: 11, name: "Mango Smoothie", desc: "Fresh mango, yogurt, honey blend", price: 129, rating: 4.5, emoji: "🥤", category: "drinks" },
            { id: 12, name: "Cold Coffee", desc: "Rich espresso, milk, ice cream blend", price: 119, rating: 4.6, emoji: "🥤", category: "drinks" },
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentCategory = 'all';

        function renderFoods(items) {
            const grid = document.getElementById('food-grid');
            grid.innerHTML = items.map(food => `
                <div class="food-card">
                    <div class="food-img">${food.emoji}</div>
                    <div class="food-info">
                        <div class="food-name">${food.name}</div>
                        <div class="food-desc">${food.desc}</div>
                        <div class="food-bottom">
                            <div>
                                <div class="food-price">Rs.${food.price}</div>
                                <div class="food-rating">⭐ ${food.rating}</div>
                            </div>
                            <button class="add-btn" onclick="addToCart(${food.id})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function filterFood() { applyFilters(); }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            let filtered = foods;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategory);
            }
            if (search) {
                filtered = filtered.filter(f => 
                    f.name.toLowerCase().includes(search) || 
                    f.desc.toLowerCase().includes(search)
                );
            }
            renderFoods(filtered);
        }

        function addToCart(id) {
            const food = foods.find(f => f.id === id);
            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...food, qty: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showToast(food.emoji + ' ' + food.name + ' added!');
        }

        function updateCartCount() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('nav-cart-count').innerText = total;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = '✅ ' + msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Load foods on page start
        renderFoods(foods);
        updateCartCount();
    </script>

</body>
</html>
